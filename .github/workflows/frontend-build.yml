name: Build ServiceCare frontend

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.SERVICECARE_API_URL }}
      VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN_URL }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
      VITE_REDIRECT_URI: ${{ vars.SERVICECARE_FRONTEND_URL }}/auth/callback
      VITE_LOGOUT_URI: ${{ vars.SERVICECARE_FRONTEND_URL }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: servicecare-frontend-dist
          path: frontend/dist/
          if-no-files-found: error